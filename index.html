            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <g>
                    <path d="M41.8,8H21.7A6.2,6.2,0,0,0,16,4a6,6,0,0,0-5.6,4H6.2A2.1,2.1,0,0,0,4,10a2.1,2.1,0,0,0,2.2,2h4.2A6,6,0,0,0,16,16a6.2,6.2,0,0,0,5.7-4H41.8A2.1,2.1,0,0,0,44,10,2.1,2.1,0,0,0,41.8,8ZM16,12a2,2,0,1,1,2-2A2,2,0,0,1,16,12Z" />
                    <path d="M41.8,22H37.7A6.2,6.2,0,0,0,32,18a6,6,0,0,0-5.6,4H6.2a2,2,0,1,0,0,4H26.4A6,6,0,0,0,32,30a6.2,6.2,0,0,0,5.7-4h4.1a2,2,0,1,0,0-4ZM32,26a2,2,0,1,1,2-2A2,2,0,0,1,32,26Z" />
                    <path d="M41.8,36H24.7A6.2,6.2,0,0,0,19,32a6,6,0,0,0-5.6,4H6.2a2,2,0,1,0,0,4h7.2A6,6,0,0,0,19,44a6.2,6.2,0,0,0,5.7-4H41.8a2,2,0,1,0,0-4ZM19,40a2,2,0,1,1,2-2A2,2,0,0,1,19,40Z" />

            </svg>
        </div>
        <label class="play-countdown count-down-animation"></label>
        <h1 class="word"></h1>
        <div class="countdown"></div>
        <div class="next-button button" resource-key="next" onclick="app.nextWord();"></div>
    </div>

    <dialog class="modal modal-settings">
        <button autofocus style="position: absolute; opacity: 0; pointer-events: none;"></button>
        <div class="modal-title" resource-key="settings"></div>
        <div class="modal-content">
            <form name="option-form">
                <div class="modal-item">
                    <label for="option-lang" resource-key="lang"></label>
                    <select id="option-lang" name="option-lang" onchange="app.onSettingChanged('lang', this);">
                        <option value="tr" resource-key="turkish">Türkçe</option>
                        <option value="en" resource-key="english">İngilizce</option>
                    </select>
                </div>
                <div class="modal-item">
                    <label for="option-countdown" resource-key="countdown"></label>
                    <select id="option-countdown" name="option-countdown" onchange="app.onSettingChanged('countdown', this)">
                        <option value="30" resource-key="seconds_30"></option>
                        <option value="60" resource-key="seconds_60"></option>
                    </select>
                </div>
                <div class="modal-item">
                    <label for="option-theme" resource-key="theme"></label>
                    <select id="option-theme" name="option-theme" onchange="app.onSettingChanged('theme', this)">
                        <option value="light" resource-key="theme_light"></option>
                        <option value="dark" resource-key="theme_dark"></option>
                        <option value="default" resource-key="theme_default"></option>
                    </select>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="modal-button button" resource-key="close" onclick="app.modal.close();"></button>
        </div>
        <div class="float-notification" resource-key="changes_saved"></div>
    </dialog>

    <script src="sw.js"></script>
    <script src="js/main.js"></script>

    <script>
        (function () {
            window.addEventListener("contextmenu", function (e) { e.preventDefault(); })
            document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
            // document.onmousedown = function () { return false; }
            document.onselectstart = function () { return false; }

            app.init();
            document.addEventListener('visibilitychange', app.onVisibilityChanged);
        })();
    </script>
</body>

</html>
